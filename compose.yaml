services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: client_source
      POSTGRES_USER: source
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d client_source"]
      interval: ${DEFAULT_HEALTHCHECK_INTERVAL}
      timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}
      retries: ${DEFAULT_HEALTHCHECK_RETRIES}
      start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}
  opensearch:
    image: opensearchproject/opensearch:3.3.2
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: ${DEFAULT_HEALTHCHECK_INTERVAL}
      timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}
      retries: ${DEFAULT_HEALTHCHECK_RETRIES}
      start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}
  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: local
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: ${DEFAULT_HEALTHCHECK_INTERVAL}
      timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}
      retries: ${DEFAULT_HEALTHCHECK_RETRIES}
      start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}
  replicator:
    image: replicator
    build:
      context: ./apps/replicator
  consumer:
    image: consumer
    build:
      context: ./apps/consumer

volumes:
  postgres-data:
  opensearch-data:
  rabbitmq-data:
