services:
  source-writer:
    profiles: ["seed"]
    build:
      context: ./apps/source-writer
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: client_source
      PGUSER: source
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: client_source
      POSTGRES_USER: source
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d client_source"]
      interval: ${DEFAULT_HEALTHCHECK_INTERVAL}
      timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}
      retries: ${DEFAULT_HEALTHCHECK_RETRIES}
      start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}
  opensearch:
    image: opensearchproject/opensearch:3.4.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: ${DEFAULT_HEALTHCHECK_INTERVAL}
      timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}
      retries: ${DEFAULT_HEALTHCHECK_RETRIES}
      start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.4.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5601/api/status"]
      interval: ${DEFAULT_HEALTHCHECK_INTERVAL}
      timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}
      retries: ${DEFAULT_HEALTHCHECK_RETRIES}
      start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}
    depends_on:
      opensearch:
        condition: service_healthy
  dashboards-setup:
    image: opensearchproject/opensearch-dashboards:3.4.0
    entrypoint: ["/usr/share/opensearch-dashboards/node/bin/node", "/setup/setup.mjs"]
    volumes:
      - ./docker/dashboards/setup.mjs:/setup/setup.mjs:ro
    depends_on:
      dashboards:
        condition: service_healthy
  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: local
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Use the server account so an early probe cannot create a root-owned cookie.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: ${DEFAULT_HEALTHCHECK_INTERVAL}
      timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}
      retries: ${DEFAULT_HEALTHCHECK_RETRIES}
      start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}
  replicator:
    image: replicator
    build:
      context: ./apps/replicator
    environment:
      CHECKPOINT_PATH: /state/progress.sqlite
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: local
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      OPENSEARCH_URL: http://opensearch:9200
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1000}
      POLL_MAX_EMPTY: ${POLL_MAX_EMPTY:-3}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: client_source
      PGUSER: source
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - replicator-state:/state
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  consumer:
    image: consumer
    build:
      context: ./apps/consumer
    environment:
      RECEIPT_PATH: /state/receipts.sqlite
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: local
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - consumer-state:/state
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  consumer-state:
  replicator-state:
  postgres-data:
  opensearch-data:
  rabbitmq-data:
